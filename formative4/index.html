<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formative4 - Signup</title>
  <style>
    /* minimal base styles so JS tweaks have consistent baseline */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial; }
    img { max-width: 100%; height: auto; display: block; }
    /* make sure table can scroll on small screens */
    .table-section table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-labelledby="form-title">
      <h2 id="form-title">Signup Form</h2>

      <form id="signupForm" novalidate>
        <label for="idNumber">ID Number</label>
        <input id="idNumber" name="idNumber" type="text" inputmode="numeric" />

        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" />

        <label for="middleName">Middle Name</label>
        <input id="middleName" name="middleName" type="text" />

        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" />

        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">-- select --</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Other">Other</option>
        </select>

        <label for="birthday">Birthday</label>
        <input id="birthday" name="birthday" type="date" />

        <button type="submit">Add</button>
      </form>
    </section>

    <section class="table-section" aria-labelledby="data-title">
      <h3 id="data-title">Registered Users</h3>
      <table id="dataTable" aria-describedby="data-title">
        <thead>
          <tr>
            <th>ID</th>
            <th>First</th>
            <th>Middle</th>
            <th>Last</th>
            <th>Gender</th>
            <th>Birthday</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- Theme toggle button (script styles this) -->
  <button id="toggleTheme" aria-pressed="false" aria-label="Toggle theme">Dark Mode</button>

  <!-- load script at end so DOM is available; script already uses DOMContentLoaded as extra safety -->
  <script src="script.js"></script>
</body>
</html>
