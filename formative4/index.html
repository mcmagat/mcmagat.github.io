<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formative4 - Sign up</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial;
      background: linear-gradient(to right, #8ebdecff, #115098ff);
      min-height: 100vh;
      display: flex;
      justify-content: center; 
      padding: 2rem;
    }

    main {
      width: 100%;
      max-width: 920px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .container, .table-section {
      width: 100%;
      max-width: 520px; 
      background: #fff;
      border-radius: 10px;
      padding: 1.6rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .table-section {
      max-width: 720px; 
      padding: 1rem;
    }

    h2, h3 { color: #3a8dde; text-align: center; margin: 0 0 0.8rem 0; }
    form { width: 100%; display: block; }

    label { display:block; margin-top: 0.9rem; font-weight:600; font-size:0.95rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-size: 0.95rem;
    }

    button[type="submit"] {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.7rem;
      background-color: #3a8dde;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

.table-section .table-wrap {
  display: block;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.table-section table {
  width: 100%;
  border-collapse: collapse;
  display: table;
  min-width: 600px; 
}
.table-section th,
.table-section td {
  border: 1px solid #ddd;
  padding: 0.5rem;
  text-align: left;
  vertical-align: middle;
}
.table-section th {
  background: #e6f0ff;
  font-weight: 600;
}

    #toggleTheme {
      position: fixed;
      z-index: 1000;
      border-radius: 6px;
      border: 2px solid #3a8dde;
      background: #fff;
      color: #3a8dde;
      padding: 0.6rem 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .container, .table-section { padding: 1rem; border-radius: 8px; }
      .container { max-width: 520px; }
      .table-section { max-width: 100%; }
      h2 { font-size: 1.25rem; }
      #toggleTheme { right: 10px; bottom: 10px; padding: 0.45rem 0.6rem; }
      .table-section th, .table-section td { font-size: 0.85rem; padding: 0.45rem; }
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-labelledby="form-title">
      <h2 id="form-title">Sign-up Form</h2>

      <form id="signupForm" novalidate>
        <label for="idNumber">ID Number</label>
        <input id="idNumber" name="idNumber" type="text" inputmode="numeric" />

        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" />

        <label for="middleName">Middle Name</label>
        <input id="middleName" name="middleName" type="text" />

        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" />

        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">-- select --</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Other">Other</option>
        </select>

        <label for="birthday">Birthday</label>
        <input id="birthday" name="birthday" type="date" />

        <button type="submit">Add</button>
      </form>
    </section>

    <section class="table-section" aria-labelledby="data-title">
      <h3 id="data-title">Registered Users</h3>
      <div class="table-wrap" aria-hidden="false">
        <table id="dataTable" aria-describedby="data-title">
          <thead>
            <tr>
              <th>ID</th>
              <th>First name</th>
              <th>Middle Name</th>
              <th>Last Name</th>
              <th>Gender</th>
              <th>Birthday</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <button id="toggleTheme" aria-pressed="false" aria-label="Toggle theme">Dark Mode</button>

  <script src="script.js"></script>
</body>
</html>
